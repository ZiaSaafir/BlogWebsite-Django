<!-- blog/templates/blog/login.html -->
{% extends "blog/base.html" %}

{% block title %}Login - COLAB Blog{% endblock title %}

{% block content %}
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="h3 fw-bold mb-4">Log In</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Log In</button>
            </form>

            <hr class="my-4">
            <div class="text-muted small">
                Need an account? 
                <a href="{% url 'register' %}" class="fw-bold text-decoration-none ms-1">Sign Up Now</a>
            </div>
        </div>
    </div>
{% endblock content %}
